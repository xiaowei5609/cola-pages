<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#D6EAF8"><title>随便写</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#D6EAF8 0 55%,#9ed17b 56%,#FEF9E7 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#3d4a38}.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.9}.c1{width:120px;height:38px;left:24px;top:72px}.c2{width:84px;height:30px;right:35px;top:120px}.count{position:fixed;right:16px;top:16px;background:#fff;color:#E8611A;padding:8px 14px;border-radius:999px;font-weight:800}.garden{min-height:58vh;position:relative}.plant{position:absolute;text-align:center}.stem{width:28px;height:50px;margin:auto;position:relative}.stem:before{content:"";position:absolute;left:13px;top:14px;width:3px;height:36px;background:#5ea840}.stem:after{content:"";position:absolute;left:5px;top:18px;width:20px;height:14px;background:#529438;border-radius:50%;transform:rotate(-28deg)}.head{position:absolute;left:5px;top:0;width:24px;height:18px;background:#E8611A;border-radius:50%}.tag{display:block;max-width:150px;background:#fff;border:1px solid #FDEBD0;border-radius:8px;padding:5px 8px;font-size:13px;line-height:1.35;word-break:break-all}.bottom{position:fixed;left:14px;right:14px;bottom:14px;z-index:10}.inputrow{display:flex;gap:9px;margin-bottom:10px}.input{min-width:0;flex:1;border:3px solid #E8611A;border-radius:999px;padding:13px 15px;font-size:16px;background:#fff}.plantbtn{border:0;border-radius:999px;background:#E8611A;color:#fff;padding:0 16px;font-size:15px;font-weight:800}.voice{width:100%;border:0;border-radius:999px;background:#2471A3;color:#fff;padding:17px 0;font-size:19px;font-weight:800}.voice.rec{background:#E8611A}.toast{position:fixed;z-index:20;left:50%;top:42%;transform:translate(-50%,-50%);max-width:82vw;background:#fff;padding:16px 20px;border-radius:16px;font-size:18px;line-height:1.6;box-shadow:0 8px 28px #0002;text-align:center}.hidden{display:none}.status{position:fixed;left:50%;top:28%;transform:translateX(-50%);color:#2471A3;font-weight:800;font-size:16px}</style></head><body><div class="cloud c1"></div><div class="cloud c2"></div><div class="count">🌱 <span id="count">0</span> 句</div><div class="garden" id="garden"></div><div class="status hidden" id="status"></div><div class="toast hidden" id="toast"></div><div class="bottom"><div class="inputrow"><input class="input" id="input" placeholder="也可以敲一句..."><button class="plantbtn" id="plant">种下去</button></div><button class="voice" id="voice">🎤 按住说话</button></div><script>const API='https://cola-dispatch.marswave-543.workers.dev/app-37d606/api/asr';const notes=JSON.parse(localStorage.getItem('suibianxie-web-notes')||'[]');const $=id=>document.getElementById(id);let stream,rec,chunks=[],recording=false;function save(){localStorage.setItem('suibianxie-web-notes',JSON.stringify(notes))}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2600)}function add(text){text=(text||'').trim();if(!text)return;notes.push({text,x:8+Math.random()*72,y:20+Math.random()*35});save();render();toast(text);$('input').value=''}function render(){$('count').textContent=notes.length;document.querySelectorAll('.plant').forEach(x=>x.remove());notes.forEach(n=>{const el=document.createElement('div');el.className='plant';el.style.left=n.x+'%';el.style.top=n.y+'%';el.innerHTML='<div class="stem"><div class="head"></div></div><span class="tag"></span>';el.querySelector('.tag').textContent=n.text;$('garden').appendChild(el)})}async function start(){if(recording)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=send;rec.start();recording=true;$('voice').classList.add('rec');$('voice').textContent='🔴 松手，正在记录';$('status').textContent='正在听';$('status').classList.remove('hidden')}catch(e){toast('麦克风没有打开，请允许浏览器使用麦克风')}}function stop(){if(!recording)return;recording=false;rec.stop();stream?.getTracks().forEach(t=>t.stop());$('voice').classList.remove('rec');$('voice').textContent='🎤 按住说话';$('status').textContent='正在变成文字'}async function send(){try{const type=chunks[0]?.type||'audio/mp4';const ext=type.includes('webm')?'webm':'m4a';const data=new FormData();data.append('audio',new Blob(chunks,{type}),`voice.${ext}`);const r=await fetch(API,{method:'POST',body:data});const j=await r.json();if(j.ok&&j.text)add(j.text);else toast(j.message||'没有听清，请再说一次')}catch(e){toast('网络连接失败，请再试一次')}finally{$('status').classList.add('hidden')}}$('voice').addEventListener('touchstart',e=>{e.preventDefault();start()},{passive:false});$('voice').addEventListener('touchend',e=>{e.preventDefault();stop()},{passive:false});$('voice').addEventListener('mousedown',start);$('voice').addEventListener('mouseup',stop);$('plant').onclick=()=>add($('input').value);$('input').onkeydown=e=>{if(e.key==='Enter')add($('input').value)};render();</script></body></html>
